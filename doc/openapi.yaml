openapi: 3.0.0
info:
  title: Magua Fly API
  version: 1.0.0
  description: 飞校平台后端接口
servers:
  - url: http://localhost:8080
    description: 本地开发环境（Docker / 本机）

paths:
  /health:
    get:
      summary: 健康检查
      tags: [System]
      responses:
        "200":
          description: 服务健康
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/login:
    post:
      summary: 用户登录
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 用户名
                  example: admin
                password:
                  type: string
                  format: password
                  description: 密码
                  example: "123456"
              required: [username, password]
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT 访问令牌
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: 账号或密码错误

  /auth/register:
    post:
      summary: 用户注册
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                phone:
                  type: string
                email:
                  type: string
                  format: email
              required: [username, password]
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /students:
    get:
      summary: 学员列表
      description: |
        返回当前系统中的学员列表。  
        需要登录并携带 `Authorization: Bearer <token>`。
      tags: [Student]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: 页码（可选）
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
          description: 每页数量（可选）
      responses:
        "200":
          description: 学员列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"

  /instructors:
    get:
      summary: 教员列表
      tags: [Instructor]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 教员列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instructor"

  /aircraft:
    get:
      summary: 航空器列表
      tags: [Aircraft]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 航空器列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Aircraft"

  /bookings/pending:
    get:
      summary: 待审核预约列表
      tags: [Booking]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 待审核的预约列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /bookings:
    post:
      summary: 创建预约
      tags: [Booking]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: integer
                  description: 学员 ID
                instructor_id:
                  type: integer
                  description: 教员 ID
                aircraft_id:
                  type: integer
                  description: 航空器 ID
                plan_date:
                  type: string
                  format: date
                  description: 预约日期（YYYY-MM-DD）
                start_time:
                  type: string
                  format: time
                  description: 开始时间（HH:MM）
                end_time:
                  type: string
                  format: time
                  description: 结束时间（HH:MM）
              required:
                [
                  student_id,
                  instructor_id,
                  aircraft_id,
                  plan_date,
                  start_time,
                  end_time,
                ]
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/review:
    post:
      summary: 审核预约
      tags: [Booking]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: 预约 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                  description: 审核结果
                reject_reason:
                  type: string
                  description: 拒绝原因（当 status = rejected 时必填）
      responses:
        "200":
          description: 审核结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        phone:
          type: string
        email:
          type: string
        role:
          type: string
          description: 用户角色：admin/staff/instructor/student

    Student:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
          nullable: true
        name:
          type: string
        student_no:
          type: string
        flown_minutes:
          type: integer
          description: 已飞行分钟数
        training_progress:
          type: string
          nullable: true
        responsible_instructor_id:
          type: integer
          nullable: true

    Instructor:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        display_color:
          type: string
          nullable: true

    Aircraft:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
          nullable: true
        status:
          type: string
          description: 航空器状态（active/maintenance/blocked 等）

    Booking:
      type: object
      properties:
        id:
          type: integer
        student_id:
          type: integer
        instructor_id:
          type: integer
        aircraft_id:
          type: integer
        plan_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        status:
          type: string
          description: 预约状态（pending/approved/rejected）
        reject_reason:
          type: string
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        reviewer_id:
          type: integer
          nullable: true
