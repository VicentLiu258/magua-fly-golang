services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/maguafly?sslmode=disable"
      MONGODB_URI: "mongodb://mongodb:27017"
      MONGODB_DB: "maguafly"
      JWT_SECRET: "change-me-in-production"
      MIGRATE_PATH: "file:///app/migrations"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maguafly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    container_name: magua-fly-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

  # 宿主机未安装 Node 时，用下面一次性任务在容器内生成 .next（与 frontend 同挂载、同环境变量）。
  # 用法：在 compose 文件所在目录执行
  #   docker compose --profile build run --rm frontend-build
  # 然后再：docker compose up -d frontend
  frontend-build:
    profiles: ["build"]
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ../:/app
    environment:
      API_UPSTREAM: "http://app:8080"
    command: sh -c "npm ci && npm run build"

  # 前端：依赖宿主机（挂载目录）里已有 .next；无 Node 时用 frontend-build 生成。
  # next.config 的 rewrites 在 npm run build 时写入 .next/routes-manifest.json。
  frontend:
    image: node:20-alpine
    container_name: nextjs-frontend
    working_dir: /app
    volumes:
      - ../:/app
    environment:
      API_UPSTREAM: "http://app:8080"
    command: npm start
    ports:
      - "3000:3000"
    depends_on:
      - app

volumes:
  postgres_data:
  mongodb_data:
