user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;
    # 强制加到 128k (哪怕 1MB 都可以，防止长 Token 拦截)
    client_header_buffer_size 64k;         # 调大默认 Header 缓冲区 (原默认 1k)
    large_client_header_buffers 4 128k;      # 调大超大 Header 的个数及大小 (原默认 4 8k)
    # 防止 POST 数据体过大 (如果是 500 的另一个源头)
    client_max_body_size 50M; 

    keepalive_timeout  65;

    # Gzip settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Configuration for reverse proxy
    upstream app_server {
        server app:8080;
    }

    # 定义前端 upstream
    upstream frontend_server {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name mugglefs.com www.mugglefs.com;

        # -----------------------------------------------------------------
        # 路由顺序说明（正式环境常见问题）：
        # - 若缺少下面两段，或它们写在 location / 之后且被错误合并/覆盖，
        #   则 /api/v1/* 会落到 Next 的 location /，POST 带 JSON 常表现为 4xx。
        # - 使用 ^~ 前缀：一旦匹配 /api/ 或 /auth/，不再尝试正则 location，
        #   避免日后新增 location ~ 时抢走 API 流量。
        # -----------------------------------------------------------------

        location ^~ /api/ {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            client_max_body_size 50M;
        }

        location ^~ /auth/ {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            client_max_body_size 50M;
        }

        # Health check endpoint
        location = /health {
            access_log off;
            return 200 'OK';
        }

        # 前端（Next.js）：必须放在 /api/、/auth/ 之后，仅处理剩余路径
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Custom error pages
        error_page 404 /404.html;
        location = /40x.html {
            root /usr/share/nginx/html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
